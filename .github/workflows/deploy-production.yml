name: Deploy to Contabo VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Navigate to the target project directory (customize this path)
            cd /opt/tulete-web-app
            
            # Pull the latest code from the main branch
            git pull origin main
            
            # Build the new Docker image and restart the specific container
            # Replace 'tulete-web' with the actual service name in your docker-compose.yml
            docker compose up -d --build tulete-web
            
            # Clean up old dangling images to save disk space
            docker image prune -f

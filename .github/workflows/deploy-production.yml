name: Tulete Frontend CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
#demo
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Create .env file
        run: |
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" >> .env
          echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}" >> .env
          echo "VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}" >> .env
          echo "VITE_APP_CURRENCY=${{ secrets.VITE_APP_CURRENCY }}" >> .env
          echo "VITE_PLAY_STORE_URL=${{ secrets.VITE_PLAY_STORE_URL || 'https://go.tulete.net/link' }}" >> .env

      - name: Install dependencies
        run: npm ci
#demo
      - name: Build frontend
        run: npm run build

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t multi-frontend-tulete_web_app .

      - name: Push Docker image
        run: |
          docker tag multi-frontend-tulete_web_app ${{ secrets.DOCKER_USERNAME }}/multi-frontend-tulete_web_app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/multi-frontend-tulete_web_app:latest

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SERVER_KEY }}

      - name: Check Secrets
        run: |
          if [ -z "${{ secrets.SERVER_USER }}" ] || [ -z "${{ secrets.SERVER_HOST }}" ]; then
            echo "ERROR: SERVER_USER or SERVER_HOST secret is missing or empty!"
            echo "Please go to your GitHub Repository -> Settings -> Secrets and variables -> Actions and add them."
            exit 1
          fi

      - name: Pull and Deploy
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "cd ~/multi-frontend && docker-compose pull tulete_web_app && docker-compose up -d --force-recreate tulete_web_app"
